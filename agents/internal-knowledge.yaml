key: internal-knowledge
name: Internal Knowledge Agent
description: Lexical search over operational knowledge (repo docs + agent audit log). Returns cited passages.
vertical_id: accounting          # loaded for the pattern; v1 retrieval is cross-vertical (operational knowledge)
enabled: true

# On-demand only — no cron. Triggered with a query via Telegram /knowledge,
# /admin command bar, or `PAT_KNOWLEDGE_QUERY=... pnpm agent:run internal-knowledge`.
schedule:
  type: manual

model:
  default: claude-sonnet-4-6     # reserved for the Phase 3 LLM-synthesis upgrade

limits:
  max_turns: 15
  max_budget_usd: 0.30
  max_runtime_seconds: 120

# Read-only. No approval gates.
tools:
  - server: knowledge
    allow:
      - retrieve
  - server: telegram
    allow:
      - send_message
  - server: neon
    allow:
      - read
    scope:
      tables:
        - AgentAuditLogEntry

hooks:
  pre_tool_use:
    - audit
    - budget_check
  post_tool_use:
    - audit
    - cost_track
  can_use_tool:
    - allowlist
# Deny-by-default approval gating (S7).
approval_rules:
  never_require_approval:
    - knowledge.retrieve      # read-only corpus search, walled to repo_doc/dream_state
    - neon.read               # read-only, table-scoped in tools.scope
    - telegram.send_message   # operator notification to the fixed ops chat
