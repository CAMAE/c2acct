name: health-db-unreachable
description: /api/health/db unreachable (network error / timeout). Drift — DB unreachable.
expected_commit: "6271a69"
github_button_allowed: false
probes:
  - route: sign-in
    status: 200
    github_button_present: false
  - route: health-db
    status: null
    error: "fetch timeout after 15000ms"
  - route: release-fingerprint
    status: 200
    ok: true
    fingerprint_present: true
    commit_short: "6271a69"
    release_header_matches: true
expect:
  drift: true
  should_alert: true
  findings:
    - health_db_unreachable
