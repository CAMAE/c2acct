id: accounting
name: Accounting
version: 2
description: Accounting firm + vendor alignment pack (V1 reference Vertical Pack)

# Display-layer lexicon (class d): the industry nouns the guarded copy surfaces
# interpolate. Structure, punctuation and casing stay in the surface — a pack
# supplies words, never sentences. These values ARE the literal strings that
# shipped before the lexicon seam existed, and tests/vertical-lexicon-byte-
# identity.contract.test.ts holds them to that character-for-character.
lexicon:
  ecosystem: "accounting ecosystem"
  firm: "accounting firm"
  firmArticle: "an"
  firmPlural: "accounting firms"
  firmMarket: "accounting-firm market"
  vendorAudience: "software for accounting firms"

# Taxonomy (descriptive layer): vendor categories live in the TaxonomyBucket
# table, filtered by verticalId. Structural entities (Company, Product, Vendor,
# scores) are shared across verticals.
taxonomy:
  source: db
  filter:
    verticalId: accounting

# Question bank (class b). sourceAuthorities replaces the hardcoded classifier
# that used to live in lib/modules/qbankParser.ts: a legal or healthcare vertical
# shares NIST and nothing else, so the authority list is pack data, not code.
#
# ORDER IS SIGNIFICANT — a citation matching several authorities produces one
# ModuleSource row per match, in this order. Keep GAO → IRS → NIST → FTC → COSO
# unless you intend to reorder existing rows.
questionBank:
  # W3 — the pack-declared product-utility bank. Identity is the PAIR
  # (verticalId, versionId): the vertical half is this pack's id (and the
  # verticalId column on stored rows), the version half stays UNQUALIFIED inside
  # the file exactly as it is embedded in stored question ids today. There is no
  # slash-joined form of the key anywhere — see lib/verticals/questionBankRegistry.ts.
  #
  # Accounting's bank is in-code truth (lib/productUtilityRegistry.ts); this file
  # is its mirror, regenerated by scripts/verticals/export-product-utility-registry.ts
  # and pinned to the in-code registry by contract test, exactly as the lexicon
  # block is. Flag-off never reads it.
  utilityRegistry: registry/product-utility-v3.json
  sourceAuthorities:
    # Primary public-domain government sources (free to use outright).
    - org: GAO
      match: ["Green Book", "Yellow Book", "GAGAS", "GAO"]
      license: PUBLIC_DOMAIN
    - org: IRS
      match: ["Circular 230", "IRS"]
      license: PUBLIC_DOMAIN
    - org: NIST
      match: ["NIST"]
      license: PUBLIC_DOMAIN
    # FTC Safeguards Rule (16 CFR Part 314, GLBA implementing reg) — federal
    # regulation, public domain. Used across the Integration & Data Flow bank.
    - org: FTC
      match: ["FTC", "Safeguards Rule", "16 CFR", "GLBA"]
      license: PUBLIC_DOMAIN
    # Copyrighted-but-citable tier: summarized + attributed, never reproduced.
    - org: COSO
      match: ["COSO"]
      license: CITED

workflows:
  - templates/vendor-review.yaml
  - templates/firm-alignment-assessment.yaml

agent_prompts:
  vendor-review-assistant: prompts/vendor-review.md

compliance:
  audit_retention_days: 365
  data_residency: us-east

reference_signals: signals/accounting-baselines.json
eval_set: evals/accounting/
